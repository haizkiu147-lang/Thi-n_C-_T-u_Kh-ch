    <style>

<body class="text-gray-800">

    <div id="root"></div>

    <script type="text/babel">
        // ====================================================================================
        // MAI HOA LOGIC ENGINE
        // ====================================================================================
        const EngineLuanMaiHoa = (category, theElement, dungElement) => {
            let relationship = '';
            if (theElement === dungElement) relationship = 'TY_HOA';
            else if (ELEMENTS_RELATION[theElement].sinh === dungElement) relationship = 'THE_SINH_DUNG';
            else if (ELEMENTS_RELATION[dungElement].sinh === theElement) relationship = 'DUNG_SINH_THE';
            else if (ELEMENTS_RELATION[theElement].khac === dungElement) relationship = 'THE_KHAC_DUNG';
            else if (ELEMENTS_RELATION[dungElement].khac === theElement) relationship = 'DUNG_KHAC_THE';

            let ketLuan = '';
            
            switch (category) {
                case 'cautai':
                    ketLuan += `► **LỜI BÀN VỀ CẦU TÀI / KINH DOANH:**\n`;
                    if (relationship === 'TY_HOA') ketLuan += `- 🌟 **Tỷ Hòa (Hòa Hợp):** Mưu cầu tài lộc thuận lợi. Nên hợp tác làm ăn sẽ có kết quả tốt đẹp, đôi bên cùng có lợi.\n`;
                    else if (relationship === 'DUNG_SINH_THE') ketLuan += `- 💰 **Dụng sinh Thể (Đại Cát):** Rất tốt! Lợi nhuận kinh doanh khấm khá, tiền bạc dễ dàng thu về, có quý nhân phù trợ mang tài lộc tới.\n`;
                    else if (relationship === 'THE_KHAC_DUNG') ketLuan += `- ⚖️ **Thể khắc Dụng (Gian Nan Đắc Lợi):** Cầu tài có hy vọng nhưng phải vất vả lao tâm khổ tứ, hao tổn trí lực thì mới kiếm được tiền.\n`;
                    else if (relationship === 'THE_SINH_DUNG') ketLuan += `- 💦 **Thể sinh Dụng (Hao Tài):** Bất lợi. Chi phí đầu tư ra nhiều hơn thu vào, dễ hao tài tốn của, làm ăn mệt mỏi mà lợi nhuận không đáng kể.\n`;
                    else if (relationship === 'DUNG_KHAC_THE') ketLuan += `- ❌ **Dụng khắc Thể (Đại Hung):** Rất cấm kỵ! Cầu tài thất bại, dễ vỡ nợ, thua lỗ hoặc bị tiểu nhân lừa gạt, đoạt tài sản.\n`;
                    break;

                case 'tinhduyen':
                    ketLuan += `► **LỜI BÀN VỀ TÌNH DUYÊN / HÔN NHÂN:**\n`;
                    if (relationship === 'TY_HOA') ketLuan += `- 🌟 **Tỷ Hòa (Cát):** Tâm đầu ý hợp, môn đăng hộ đối. Tình cảm đôi bên gắn bó êm đềm, thuận lợi tiến tới lâu dài.\n`;
                    else if (relationship === 'DUNG_SINH_THE') ketLuan += `- 💞 **Dụng sinh Thể (Đại Cát):** Rất tốt. Đối phương yêu thương, quan tâm và mang lại sự tốt lành cho mình. Hôn nhân hạnh phúc.\n`;
                    else if (relationship === 'THE_KHAC_DUNG') ketLuan += `- ⚖️ **Thể khắc Dụng (Chế Ngự):** Tình cảm có phần áp đặt. Bản thân thường xuyên muốn kiểm soát, lấn lướt đối phương, lâu dài dễ sinh rạn nứt.\n`;
                    else if (relationship === 'THE_SINH_DUNG') ketLuan += `- 💦 **Thể sinh Dụng (Hao Tâm):** Mình yêu thương, chiều chuộng và nhẫn nhịn đối phương rất nhiều, cho đi nhiều hơn nhận lại, chịu nhiều thiệt thòi.\n`;
                    else if (relationship === 'DUNG_KHAC_THE') ketLuan += `- ❌ **Dụng khắc Thể (Phá Duyên):** Hung. Có sự khắc khẩu mạnh mẽ, gia đình đối phương phản đối hoặc đối phương gây tổn thương tột cùng. Khó thành tựu.\n`;
                    break;

                case 'phongthuy':
                case 'tamlinh':
                case 'tama':
                    ketLuan += `► **LỜI BÀN VỀ PHONG THỦY / TÂM LINH:**\n`;
                    if (relationship === 'TY_HOA') ketLuan += `- 🌟 **Tỷ Hòa:** Khí trường êm ấm, bình an. Không có xung sát hay hiện tượng tâm linh xấu quấy phá. Nếu là mồ mả thì yên ổn.\n`;
                    else if (relationship === 'DUNG_SINH_THE') ketLuan += `- 🛡️ **Dụng sinh Thể:** Cát lợi. Đất đai có sinh khí, được thần linh bảo hộ. Điềm báo linh ứng điềm tốt, mang lại sự hưng vượng cho gia đạo.\n`;
                    else if (relationship === 'THE_KHAC_DUNG') ketLuan += `- ⚖️ **Thể khắc Dụng:** Gia chủ tuy gặp đôi chút bất an nhưng bản mệnh mạnh, đủ sức trấn áp hung khí. Mọi sự dần dần tự hóa giải.\n`;
                    else if (relationship === 'THE_SINH_DUNG') ketLuan += `- 💦 **Thể sinh Dụng:** Đất đai hoặc ngôi nhà bị tiết khí, ở lâu người dễ sinh mệt mỏi, sinh khí suy giảm. Cần cải tạo phong thủy.\n`;
                    else if (relationship === 'DUNG_KHAC_THE') ketLuan += `- ❌ **Dụng khắc Thể:** Rất nguy hiểm! Nếu xem phong thủy thì phạm sát khí nặng. Xem điềm báo/tâm linh thì đây là sự quấy nhiễu mạnh của vong linh, tà ma, có thể gây họa. Cần sớm mời thầy giải hoặc hóa giải.\n`;
                    break;
                
                default:
                    ketLuan += `► **LỜI BÀN TỔNG QUAN TỪ QUÁI TƯỢNG:**\n`;
                    if (relationship === 'TY_HOA') ketLuan += `- 🌟 **Tỷ Hòa:** Việc êm xuôi, dễ thành công nhờ sự đồng thuận.\n`;
                    else if (relationship === 'DUNG_SINH_THE') ketLuan += `- 🌟 **Dụng sinh Thể:** Rất thuận lợi, đắc nhân tâm, gặp quý nhân phù trợ.\n`;
                    else if (relationship === 'THE_KHAC_DUNG') ketLuan += `- ⚖️ **Thể khắc Dụng:** Sự việc tuy thành nhưng gian nan, hao tâm tổn trí.\n`;
                    else if (relationship === 'THE_SINH_DUNG') ketLuan += `- 💦 **Thể sinh Dụng:** Việc làm hao tài tốn sức, kết quả không như ý.\n`;
                    else if (relationship === 'DUNG_KHAC_THE') ketLuan += `- ❌ **Dụng khắc Thể:** Gian nan vô vàn, mưu sự thất bại, dễ vướng họa.\n`;
                    break;
            }

            return ketLuan;
        };

        // ====================================================================================
        // COMPONENT RENDER TEXT FORMATTED
        // ====================================================================================
        const RenderFormattedText = ({ text }) => {
            if (!text) return null;
            
            const lines = text.split('\n');
            return (
                <div className="w-full p-4 border border-amber-300 rounded bg-white document-text text-[12px] sm:text-[13px] leading-relaxed result-formatted text-gray-900 shadow-inner">
                    {lines.map((line, index) => {
                        if (line.trim() === '') return <div key={index} className="h-3"></div>;

                        const parseBold = (str) => {
                            const parts = str.split(/(\*\*.*?\*\*)/g);
                            return parts.map((part, i) => {
                                if (part.startsWith('**') && part.endsWith('**')) {
                                    return <strong key={i} className="text-amber-900">{part.slice(2, -2)}</strong>;
                                }
                                return part;
                            });
                        };

                        if (line.startsWith('[') && line.endsWith(']')) {
                            return <h3 key={index} className="text-center font-bold text-base text-[#a91d1d] uppercase mb-1">{line.slice(1, -1)}</h3>;
                        }
                        if (line.startsWith('===')) return <div key={index} className="w-full h-px bg-amber-200 my-2"></div>;
                        if (line.startsWith('►')) return <div key={index} className="font-bold text-amber-800 text-sm mt-3 mb-1">{parseBold(line)}</div>;
                        if (line.startsWith('>')) return <blockquote key={index} className="mt-4 border-l-4 border-[#d4af37] pl-3 italic text-gray-600 font-medium bg-amber-50 py-2 rounded-r-md">{parseBold(line.substring(1).trim())}</blockquote>;
                        if (line.trim().startsWith('- ')) {
                            return (
                                <div key={index} className="flex gap-2 mb-1.5 items-start">
                                    <span className="text-amber-600 font-bold mt-0.5">•</span>
                                    <span className="flex-1">{parseBold(line.substring(2))}</span>
                                </div>
                            );
                        }
                        if (line.trim().startsWith('+ ')) {
                            return (
                                <div key={index} className="flex gap-2 mb-1 items-start ml-4">
                                    <span className="text-emerald-600 font-bold mt-0.5">◦</span>
                                    <span className="flex-1 italic text-gray-700">{parseBold(line.substring(2))}</span>
                                </div>
                            );
                        }

                        return <div key={index} className="mb-1">{parseBold(line)}</div>;
                    })}
                </div>
            );
        };


        // ====================================================================================
        // KIẾN THỨC NỀN TẢNG
        // ====================================================================================
        const TR_SINH_MAP = {
            "Mộc": { "Hợi": "Trường Sinh", "Tý": "Mộc Dục", "Sửu": "Quan Đới", "Dần": "Lâm Quan", "Mão": "Đế Vượng", "Thìn": "Suy", "Tỵ": "Bệnh", "Ngọ": "Tử", "Mùi": "Mộ", "Thân": "Tuyệt", "Dậu": "Thai", "Tuất": "Dưỡng" },
            "Hỏa": { "Dần": "Trường Sinh", "Mão": "Mộc Dục", "Thìn": "Quan Đới", "Tỵ": "Lâm Quan", "Ngọ": "Đế Vượng", "Mùi": "Suy", "Thân": "Bệnh", "Dậu": "Tử", "Tuất": "Mộ", "Hợi": "Tuyệt", "Tý": "Thai", "Sửu": "Dưỡng" },
            "Thổ": { "Thân": "Trường Sinh", "Dậu": "Mộc Dục", "Tuất": "Quan Đới", "Hợi": "Lâm Quan", "Tý": "Đế Vượng", "Sửu": "Suy", "Dần": "Bệnh", "Mão": "Tử", "Thìn": "Mộ", "Tỵ": "Tuyệt", "Ngọ": "Thai", "Mùi": "Dưỡng" },
            "Kim": { "Tỵ": "Trường Sinh", "Ngọ": "Mộc Dục", "Mùi": "Quan Đới", "Thân": "Lâm Quan", "Dậu": "Đế Vượng", "Tuất": "Suy", "Hợi": "Bệnh", "Tý": "Tử", "Sửu": "Mộ", "Dần": "Tuyệt", "Mão": "Thai", "Thìn": "Dưỡng" },
            "Thủy": { "Thân": "Trường Sinh", "Dậu": "Mộc Dục", "Tuất": "Quan Đới", "Hợi": "Lâm Quan", "Tý": "Đế Vượng", "Sửu": "Suy", "Dần": "Bệnh", "Mão": "Tử", "Thìn": "Mộ", "Tỵ": "Tuyệt", "Ngọ": "Thai", "Mùi": "Dưỡng" }
        };

        const DIA_CHI_XUNG = {'Tý':'Ngọ', 'Ngọ':'Tý', 'Sửu':'Mùi', 'Mùi':'Sửu', 'Dần':'Thân', 'Thân':'Dần', 'Mão':'Dậu', 'Dậu':'Mão', 'Thìn':'Tuất', 'Tuất':'Thìn', 'Tỵ':'Hợi', 'Hợi':'Tỵ'};
        const DIA_CHI_HOP = {'Tý':'Sửu', 'Sửu':'Tý', 'Dần':'Hợi', 'Hợi':'Dần', 'Mão':'Tuất', 'Tuất':'Mão', 'Thìn':'Dậu', 'Dậu':'Thìn', 'Tỵ':'Thân', 'Thân':'Tỵ', 'Ngọ':'Mùi', 'Mùi':'Ngọ'};
        
        const BAT_QUAI = [
            { id: 0, name: 'Càn', symbol: '☰', binary: [1, 1, 1], element: 'Kim', number: 1 },
            { id: 1, name: 'Đoài', symbol: '☱', binary: [1, 1, 0], element: 'Kim', number: 2 },
            { id: 2, name: 'Ly', symbol: '☲', binary: [1, 0, 1], element: 'Hỏa', number: 3 },
            { id: 3, name: 'Chấn', symbol: '☳', binary: [1, 0, 0], element: 'Mộc', number: 4 },
            { id: 4, name: 'Tốn', symbol: '☴', binary: [0, 1, 1], element: 'Mộc', number: 5 },
            { id: 5, name: 'Khảm', symbol: '☵', binary: [0, 1, 0], element: 'Thủy', number: 6 },
            { id: 6, name: 'Cấn', symbol: '☶', binary: [0, 0, 1], element: 'Thổ', number: 7 },
            { id: 7, name: 'Khôn', symbol: '☷', binary: [0, 0, 0], element: 'Thổ', number: 8 }
        ];

        const findTrigramFromBinary = (binArr) => {
            const t = BAT_QUAI.find(b => b.binary[0] === binArr[0] && b.binary[1] === binArr[1] && b.binary[2] === binArr[2]);
            return t ? t.id : 0;
        };

        const THIEN_CAN = ['Giáp', 'Ất', 'Bính', 'Đinh', 'Mậu', 'Kỷ', 'Canh', 'Tân', 'Nhâm', 'Quý'];
        const DIA_CHI = ['Tý', 'Sửu', 'Dần', 'Mão', 'Thìn', 'Tỵ', 'Ngọ', 'Mùi', 'Thân', 'Dậu', 'Tuất', 'Hợi'];
        const TIET_KHI_LIST = ['Lập Xuân', 'Vũ Thủy', 'Kinh Trập', 'Xuân Phân', 'Thanh Minh', 'Cốc Vũ', 'Lập Hạ', 'Tiểu Mãn', 'Mang Chủng', 'Hạ Chí', 'Tiểu Thử', 'Đại Thử', 'Lập Thu', 'Xử Thử', 'Bạch Lộ', 'Thu Phân', 'Hàn Lộ', 'Sương Giáng', 'Lập Đông', 'Tiểu Tuyết', 'Đại Tuyết', 'Đông Chí', 'Tiểu Hàn', 'Đại Hàn', 'Không dùng/Khác'];
        
        const CHI_NGU_HANH = { 'Tý': 'Thủy', 'Hợi': 'Thủy', 'Dần': 'Mộc', 'Mão': 'Mộc', 'Tỵ': 'Hỏa', 'Ngọ': 'Hỏa', 'Sửu': 'Thổ', 'Thìn': 'Thổ', 'Mùi': 'Thổ', 'Tuất': 'Thổ', 'Thân': 'Kim', 'Dậu': 'Kim' };

        const ELEMENTS_RELATION = {
            'Kim': { sinh: 'Thủy', khac: 'Mộc', dong: 'Kim' },
            'Thủy': { sinh: 'Mộc', khac: 'Hỏa', dong: 'Thủy' },
            'Mộc': { sinh: 'Hỏa', khac: 'Thổ', dong: 'Mộc' },
            'Hỏa': { sinh: 'Thổ', khac: 'Kim', dong: 'Hỏa' },
            'Thổ': { sinh: 'Kim', khac: 'Thủy', dong: 'Thổ' }
        };

        const NAP_GIAP = {
            0: { noi: ['Giáp Tý', 'Giáp Dần', 'Giáp Thìn'], ngoai: ['Nhâm Ngọ', 'Nhâm Thân', 'Nhâm Tuất'] },
            1: { noi: ['Đinh Tỵ', 'Đinh Mão', 'Đinh Sửu'], ngoai: ['Đinh Hợi', 'Đinh Dậu', 'Đinh Mùi'] },
            2: { noi: ['Kỷ Mão', 'Kỷ Sửu', 'Kỷ Hợi'], ngoai: ['Kỷ Dậu', 'Kỷ Mùi', 'Kỷ Tỵ'] },
            3: { noi: ['Canh Tý', 'Canh Dần', 'Canh Thìn'], ngoai: ['Canh Ngọ', 'Canh Thân', 'Canh Tuất'] },
            4: { noi: ['Tân Sửu', 'Tân Hợi', 'Tân Dậu'], ngoai: ['Tân Mùi', 'Tân Tỵ', 'Tân Mão'] },
            5: { noi: ['Mậu Dần', 'Mậu Thìn', 'Mậu Ngọ'], ngoai: ['Mậu Thân', 'Mậu Tuất', 'Mậu Tý'] },
            6: { noi: ['Bính Thìn', 'Bính Ngọ', 'Bính Thân'], ngoai: ['Bính Tuất', 'Bính Tý', 'Bính Dần'] },
            7: { noi: ['Ất Mùi', 'Ất Tỵ', 'Ất Mão'], ngoai: ['Quý Sửu', 'Quý Hợi', 'Quý Dậu'] }
        };

        const LUC_THU_KHOI = { 'Giáp': 0, 'Ất': 0, 'Bính': 1, 'Đinh': 1, 'Mậu': 2, 'Kỷ': 3, 'Canh': 4, 'Tân': 4, 'Nhâm': 5, 'Quý': 5 };
        const LUC_THU_LIST = ['Thanh Long', 'Chu Tước', 'Câu Trần', 'Đằng Xà', 'Bạch Hổ', 'Huyền Vũ'];

        const HEXAGRAM_DATABASE = {

        function getLucThan(cungNguHanH, haoNguHanh) {
            if (cungNguHanH === haoNguHanh) return 'Huynh Đệ';
            if (ELEMENTS_RELATION[cungNguHanH].sinh === haoNguHanh) return 'Tử Tôn';
            if (ELEMENTS_RELATION[cungNguHanH].khac === haoNguHanh) return 'Thê Tài';
            if (ELEMENTS_RELATION[haoNguHanh].sinh === cungNguHanH) return 'Phụ Mẫu';
            if (ELEMENTS_RELATION[haoNguHanh].khac === cungNguHanH) return 'Quan Quỷ';
            return '';
        }

        function getPhuTroThan(dungLucThan) {
            const roles = { nguyen: '', ky: '', cuu: '' };
            if (dungLucThan === "Thê Tài") { roles.nguyen = "Tử Tôn"; roles.ky = "Huynh Đệ"; roles.cuu = "Phụ Mẫu"; }
            else if (dungLucThan === "Quan Quỷ") { roles.nguyen = "Thê Tài"; roles.ky = "Tử Tôn"; roles.cuu = "Huynh Đệ"; }
            else if (dungLucThan === "Phụ Mẫu") { roles.nguyen = "Quan Quỷ"; roles.ky = "Thê Tài"; roles.cuu = "Tử Tôn"; }
            else if (dungLucThan === "Tử Tôn") { roles.nguyen = "Huynh Đệ"; roles.ky = "Phụ Mẫu"; roles.cuu = "Quan Quỷ"; }
            else if (dungLucThan === "Huynh Đệ") { roles.nguyen = "Phụ Mẫu"; roles.ky = "Quan Quỷ"; roles.cuu = "Thê Tài"; }
            return roles;
        }

        };

        function getVaiTroLucThan(lucThan, dungThan) {
            if (!lucThan || !dungThan) return null;
            if (dungThan === "Thế" || dungThan === "Ứng") return null;
            if (lucThan === dungThan) return "Dụng";
            const roles = getPhuTroThan(dungThan);
            if (!roles || !roles.nguyen) return null;
            if (lucThan === roles.nguyen) return "Nguyên";
            if (lucThan === roles.ky) return "Kỵ";
            if (lucThan === roles.cuu) return "Cừu";
            return "Nhàn";
        }

        function anLinhHao(trigramId, stepIdx) {
            const isUpper = stepIdx >= 3;
            const subIdx = stepIdx % 3;
            const napArray = isUpper ? NAP_GIAP[trigramId].ngoai : NAP_GIAP[trigramId].noi;
            const parts = napArray[subIdx].split(' ');
            return { can: parts[0], chi: parts[1], element: CHI_NGU_HANH[parts[1]] || "Kim" };
        }

        function timPhucThan(cungName, chuLines) {
            const cungElement = CUNG_ELEMENTS[cungName];
            const neededLucThan = ["Huynh Đệ", "Tử Tôn", "Thê Tài", "Quan Quỷ", "Phụ Mẫu"];
            const ownedLucThan = chuLines.map(l => l.lucThan);
            const missing = neededLucThan.filter(t => !ownedLucThan.includes(t));
            if (missing.length === 0) return {};

            const masterTrigram = BAT_QUAI.find(b => b.name === cungName);
            if (!masterTrigram) return {};

            const mapPhuc = {};
            for (let idx = 0; idx < 6; idx++) {
                const isUpper = idx >= 3;
                const subIdx = idx % 3;
                const napArray = isUpper ? NAP_GIAP[masterTrigram.id].ngoai : NAP_GIAP[masterTrigram.id].noi;
                const parts = napArray[subIdx].split(' ');
                const element = CHI_NGU_HANH[parts[1]];
                const lucThan = getLucThan(cungElement, element);
                
                if (missing.includes(lucThan)) {
                    mapPhuc[idx] = { lucThan, can: parts[0], chi: parts[1], element };
                }
            }
            return mapPhuc;
        }

            if (ELEMENTS_RELATION[haoElement].sinh === monthEl) return "Hưu"; 
            if (ELEMENTS_RELATION[haoElement].khac === monthEl) return "Tù";

        const DIA_CHI_HAI = {'Tý':'Mùi','Mùi':'Tý','Sửu':'Ngọ','Ngọ':'Sửu','Dần':'Tỵ','Tỵ':'Dần','Mão':'Thìn','Thìn':'Mão','Thân':'Hợi','Hợi':'Thân','Dậu':'Tuất','Tuất':'Dậu'};
        const HINH_GROUPS = [['Dần','Tỵ','Thân'], ['Sửu','Tuất','Mùi'], ['Tý','Mão']];
        const TU_HINH_CHI = ['Thìn','Ngọ','Dậu','Hợi']; 
        const TAM_HOP_GROUPS = [['Thân','Tý','Thìn','Thủy'],['Dần','Ngọ','Tuất','Hỏa'],['Tỵ','Dậu','Sửu','Kim'],['Hợi','Mão','Mùi','Mộc']];

        function isHinh(a, b) {
            if (!a || !b) return false;
            if (a === b) return TU_HINH_CHI.includes(a);

        function xetQuanHeVoiChi(chiHao, chiTacDong) {

            if (DIA_CHI_XUNG[chiHao] === chiTacDong) return { loai: "Xung", tot: false, mota: "bị xung động, dễ biến đổi/phá tán" };
            if (DIA_CHI_HOP[chiHao] === chiTacDong) return { loai: "Hợp", tot: true, mota: "được hợp trói buộc, chuyển hóa (hợp mà vượng thì tốt, hợp mà tù tử thì bị Hợp Trụ - vô dụng)" };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
