    <script type="text/babel">

        const getChiByElement = (el) => {

        const RenderFormattedText = ({ text }) => {
            if (!text) return null;

                        if (line.trim() === '') return <div key={index} className="h-3"></div>;
                        const parseBold = (str) => {
                            const parts = str.split(/(\*\*.*?\*\*)/g);
                            return parts.map((part, i) => {
                                if (part.startsWith('**') && part.endsWith('**')) return <strong key={i} className="text-amber-900">{part.slice(2, -2)}</strong>;
                                return part;
                            });
                        };
                        if (line.startsWith('[') && line.endsWith(']')) return <h3 key={index} className="text-center font-bold text-base text-[#a91d1d] uppercase mb-1">{line.slice(1, -1)}</h3>;
                        if (line.startsWith('===')) return <div key={index} className="w-full h-px bg-amber-200 my-2"></div>;
                        if (line.startsWith('►')) return <div key={index} className="font-bold text-amber-800 text-sm mt-4 mb-1 border-b border-amber-100 pb-1">{parseBold(line)}</div>;
                        if (line.startsWith('>')) return <blockquote key={index} className="mt-4 border-l-4 border-[#d4af37] pl-3 italic text-gray-600 font-medium bg-amber-50 py-2 rounded-r-md">{parseBold(line.substring(1).trim())}</blockquote>;

        const LUC_THU_KHOI = { 'Giáp': 0, 'Ất': 0, 'Bính': 1, 'Đinh': 1, 'Mậu': 2, 'Kỷ': 3, 'Canh': 4, 'Tân': 4, 'Nhâm': 5, 'Quý': 5 };

        function anLinhHao(trigramId, stepIdx) {

            const napArray = isUpper ? NAP_GIAP[trigramId].ngoai : NAP_GIAP[trigramId].noi;
            const parts = napArray[subIdx].split(' ');
            return { can: parts[0], chi: parts[1], element: CHI_NGU_HANH[parts[1]] || "Kim" };

        function timPhucThan(cungName, chuLines) {

            const neededLucThan = ["Huynh Đệ", "Tử Tôn", "Thê Tài", "Quan Quỷ", "Phụ Mẫu"];
            const ownedLucThan = chuLines.map(l => l.lucThan);
            const missing = neededLucThan.filter(t => !ownedLucThan.includes(t));
            if (missing.length === 0) return {};

            const masterTrigram = BAT_QUAI.find(b => b.name === cungName);
            if (!masterTrigram) return {};

            const mapPhuc = {};
            for (let idx = 0; idx < 6; idx++) {
                const isUpper = idx >= 3;
                const subIdx = idx % 3;
                const napArray = isUpper ? NAP_GIAP[masterTrigram.id].ngoai : NAP_GIAP[masterTrigram.id].noi;
                const parts = napArray[subIdx].split(' ');
                const element = CHI_NGU_HANH[parts[1]];
                const lucThan = getLucThan(cungElement, element);
                
                if (missing.includes(lucThan)) {
                    mapPhuc[idx] = { lucThan, can: parts[0], chi: parts[1], element };
                }
            }
            return mapPhuc;

            if (!a || !b) return false;
            if (a === b) return TU_HINH_CHI.includes(a);

            for (const g of TAM_HOP_GROUPS) {

            return null;
        }

                                                            { role: 'Biến Hạ', name: mhLowerBienQuai.name, quai: mhLowerBienQuai }
                                                        ].map((item, idx) => {
                                                            const tuong = VAN_VAT_LOAI_TUONG[item.quai.name];
                                                            const colorClass = getElementColor(item.quai.element);
                                                            return (
                                                                <tr key={idx} className="border-b border-[#e5d3b3]">
                                                                    <td className={`py-[4px] px-1 border-r border-[#e5d3b3] font-bold ${item.role === 'Quái Thể' ? 'text-emerald-700' : (item.role === 'Quái Dụng' ? 'text-red-600' : 'text-gray-600')}`}>{item.role}</td>
                                                                    <td className={`py-[4px] px-1 border-r border-[#e5d3b3] font-bold ${colorClass}`}>{item.name} ({item.quai.element})</td>
                                                                    <td className="py-[4px] px-1 border-r border-[#e5d3b3] text-gray-700">{tuong.thienNhien}</td>
                                                                    <td className="py-[4px] px-1 border-r border-[#e5d3b3] text-gray-700">{tuong.nhanVat}</td>
                                                                    <td className="py-[4px] px-1 border-r border-[#e5d3b3] text-gray-700">{tuong.coThe}</td>
                                                                    <td className="py-[4px] px-1 border-r border-[#e5d3b3] text-gray-700">{tuong.tinhChat}</td>
                                                                    <td className="py-[4px] px-1 text-gray-700">{tuong.mauSac} / {tuong.dongVat}</td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    )}

                                    <div className="mt-4 pt-1.5 border-t border-[#d4af37] flex flex-row justify-between items-end px-2 gap-2">
                                        <div className="text-[7px] sm:text-[8px] font-medium space-y-0.5 document-text text-left">
                                            <p className="text-[#a91d1d] font-bold mb-1">Hệ thống an sao Dịch Lý</p>
                                            <p className="flex items-center gap-1.5 text-gray-800"><i className="fa-brands fa-facebook text-[#1877F2]"></i> <span>FB: Lê Hữu Hải</span></p>
                                            <p className="flex items-center gap-1.5 text-gray-800"><i className="fa-solid fa-square-phone text-[#25D366]"></i> <span>Zalo: 0982076615</span></p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-[6px] sm:text-[7px] text-amber-900 mb-[-2px] font-bold uppercase tracking-widest document-text">Thiết kế bởi</p>
                                            <h3 className="text-[18px] sm:text-[22px] rainbow-text signature-font font-bold">Thiên Cơ Tửu Khách</h3>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* KHU VỰC LỜI BÀN ĐƯỢC TÁCH RA NGOÀI (KHÔNG NẰM TRONG ẢNH TẢI VỀ) */}
                            {systemType === 'luchao' && (
                                <div id="luan-giai-result-section" className="w-full max-w-[920px] mt-6 mb-8 border border-amber-200 rounded-xl shadow-md bg-white p-2 sm:p-4 relative">
                                    <div className="flex items-center gap-2 mb-3 border-b border-amber-200 pb-2">
                                        <div className="bg-[#a91d1d] text-white w-8 h-8 rounded-full flex items-center justify-center shadow-sm">
                                            <i className="fa-solid fa-book-journal-whills text-lg"></i>
                                        </div>
                                        <h3 className="text-[16px] sm:text-[18px] font-bold text-[#8b1c1c] uppercase serif-title">Chi Tiết Lời Bàn</h3>
                                    </div>
                                    
                                    {luanGiaiText ? (
                                        <RenderFormattedText text={luanGiaiText} />
                                    ) : (
                                        <div className="w-full p-4 border border-dashed border-amber-300 rounded bg-amber-50/50 text-gray-500 text-sm text-center italic min-h-[150px] flex items-center justify-center">
                                            Hệ thống đang chờ lệnh... Vui lòng bấm nút "Tự Động Luận Giải" phía trên để Dịch Sư phân tích chi tiết lá quẻ.
                                        </div>
                                    )}
                                </div>
                            )}

                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
</body>
</html>
