            "Sơn Thủy Mông": { stt: "4.", hanh: "Thổ", tuong: "Trừu lý cầu ti chi quái, mờ mịt bất định chi tượng.", luan: "Mông giả muội dã. Sương mù lấp lối, trẻ nhỏ chưa tỏ. Cần người dẫn dắt, học hỏi điều hay. Chớ nên vội vàng manh động, phải nhờ người hiền chỉ giáo." },
            "Thủy Thiên Nhu": { stt: "5.", hanh: "Thổ", tuong: "Vân ai trung thiên chi quái, mật vân bất vũ chi tượng.", luan: "Nhu giả đãi dã. Mây mù đầy trời, gặp nguy hiểm không biết, thân sẽ ở nơi tai ách, e là bị liên lụy. Đại sự mong tới cùng, âu lo triền miên." },
            "Thiên Thủy Tụng": { stt: "6.", hanh: "Kim", tuong: "Khởi mưu động đoạt chi quái, bất hòa tranh tụng chi tượng.", luan: "Tụng giả thoái dã. Trên dưới trái ngược, ý kiến bất đồng. Kiện tụng tranh chấp, đôi bên đều thiệt. Nên lui một bước, hòa giải là hơn." },
            "Địa Thủy Sư": { stt: "7.", hanh: "Thổ", tuong: "Thiên tướng xuất trận chi quái, danh chính ngôn thuận chi tượng.", luan: "Sư giả chúng dã. Cất quân dẹp loạn, quần chúng tụ tập. Tướng tài chỉ huy, gian nan vất vả nhưng nếu có kỷ luật và danh chính thì ắt thành công." },
            "Thủy Địa Tỷ": { stt: "8.", hanh: "Thổ", tuong: "Nguyệt lưu thủy di chi quái, tương thân tương ái chi tượng.", luan: "Tỷ giả hòa dã. Hợp bầy kết bạn, nương tựa lẫn nhau. Nước liền với đất, thân thiết thuận hòa. Kẻ dưới theo trên, mọi việc đều tốt đẹp." },
            "Phong Thiên Tiểu Súc": { stt: "9.", hanh: "Mộc", tuong: "Mật vân bất vũ chi quái, súc tích tiểu thành chi tượng.", luan: "Tiểu súc giả quả dã. Tích lũy nhỏ nhoi, mây nhiều chưa mưa. Duyên nợ chưa tới, tài lộc còn hạn chế. Nên kiên nhẫn bồi đắp, chưa thể mưu sự lớn." },
            "Thiên Trạch Lý": { stt: "10.", hanh: "Kim", tuong: "Hổ khẩu tựa tì chi quái, hành bộ kinh tâm chi tượng.", luan: "Lý giả lễ dã. Đạp đuôi hổ dữ, cẩn trọng từng bước. Lễ nghi phép tắc, cư xử phải phép. Nhu thuận đối đãi với kẻ mạnh thì sẽ tai qua nạn khỏi." },
            "Địa Thiên Thái": { stt: "11.", hanh: "Thổ", tuong: "Thiên địa giao thái chi quái, âm dương hòa hợp chi tượng.", luan: "Thái giả thông dã. Trời đất giao hòa, vạn vật hanh thông. Kẻ tiểu nhân lui, người quân tử tiến. Thời vận hanh thông, mưu sự ắt thành." },
            "Thiên Địa Bĩ": { stt: "12.", hanh: "Kim", tuong: "Thiên địa bất giao chi quái, bế tắc không thông chi tượng.", luan: "Bĩ giả tắc dã. Trời đất cách trở, âm dương không giao. Quân tử phải lùi, tiểu nhân đắc thế. Bế tắc mọi bề, nên giữ mình chờ thời, chớ vọng động." },
            "Thiên Hỏa Đồng Nhân": { stt: "13.", hanh: "Kim", tuong: "Phân kim yến khách chi quái, kết giao bạn hữu chi tượng.", luan: "Đồng nhân giả thân dã. Cùng người hòa hợp, đi chung một đường. Kết bạn đồng tâm, sức mạnh to lớn. Hợp tác làm ăn sẽ có lợi, đi xa gặp quý nhân." },
            "Hỏa Thiên Đại Hữu": { stt: "14.", hanh: "Hỏa", tuong: "Kim ngọc mãn đường chi quái, quang minh chính đại chi tượng.", luan: "Đại hữu giả khoan dã. Sở hữu nhiều nhặn, tiền tài dư dả. Mặt trời trên không, soi sáng muôn nơi. Vận thế lên cao, làm gì cũng đạt kết quả tốt." },
            "Địa Sơn Khiêm": { stt: "15.", hanh: "Thổ", tuong: "Xưng vật bình thi chi quái, khiêm hư thụ ích chi tượng.", luan: "Khiêm giả thoái dã. Đỉnh núi ẩn dưới đất, tự nhún nhường không khoe khoang. Lùi một bước tiến ba bước. Giữ đức khiêm tốn sẽ được mọi người kính trọng, cát lợi." },
            "Lôi Địa Dự": { stt: "16.", hanh: "Mộc", tuong: "Phượng minh kỳ sơn chi quái, hoan hỷ duyệt ý chi tượng.", luan: "Dự giả duyệt dã. Sấm nổ trên đất, khí dương bừng tỉnh, vạn vật vui vẻ. Cát khánh đến nhà, tinh thần phấn chấn. Mọi sự chuẩn bị kỹ lưỡng ắt đạt thành vui vẻ." },
            "Trạch Lôi Tùy": { stt: "17.", hanh: "Kim", tuong: "Đạp thụ bạt mộc chi quái, tòng thuận tùy thời chi tượng.", luan: "Tùy giả thuận dã. Đi theo người khác, thuận theo thời thế. Dưới chấn trên đoài, có sự vui vẻ khi tuân theo. Chớ nên cố chấp, thay đổi linh hoạt thì mới tốt." },
            "Sơn Phong Cổ": { stt: "18.", hanh: "Thổ", tuong: "Tranh hùng khích biến chi quái, đổ nát tân tu chi tượng.", luan: "Cổ giả bại dã. Đồ đạc hỏng hóc, sự nghiệp mục nát, sâu bọ sinh ra. Đã đến lúc phải chấn chỉnh, sửa chữa lại từ đầu. Việc tuy khó nhọc nhưng sửa xong sẽ hưng vượng." },
            "Địa Trạch Lâm": { stt: "19.", hanh: "Thổ", tuong: "Phụng cách chi điểu chi quái, hỷ khí quân lâm chi tượng.", luan: "Lâm giả đại dã. Lớn mạnh đến gần, quang minh bao trùm. Người trên thân thiện với kẻ dưới, uy quyền ân uy tịnh thi. Vận thế đang vươn lên mạnh mẽ." },
            "Phong Địa Quan": { stt: "20.", hanh: "Mộc", tuong: "Hải quan viễn cảnh chi quái, chiêm ngưỡng tôn sùng chi tượng.", luan: "Quan giả quan dã. Đứng trên cao nhìn xuống, quan sát thế cục. Gió thổi trên đất, lan tỏa khắp nơi. Cần suy xét kỹ lưỡng trước khi hành động, tĩnh quan kỳ biến." },
            "Hỏa Lôi Phệ Hạp": { stt: "21.", hanh: "Hỏa", tuong: "Nham trung di châu chi quái, uy hình pháp luật chi tượng.", luan: "Phệ hạp giả giảo dã. Miệng cắn nát vật cản, thi hành hình phạt, dùng uy quyền giải quyết chướng ngại. Bất đồng tranh chấp cần nhờ pháp luật hoặc người có uy tín phán xử." },
            "Sơn Hỏa Bí": { stt: "22.", hanh: "Thổ", tuong: "Nham trung vi tuyền chi quái, trang sức hào nhoáng chi tượng.", luan: "Bí giả sức dã. Lửa chiếu sáng chân núi, văn minh rực rỡ. Bề ngoài đẹp đẽ, trang sức lộng lẫy nhưng bề trong có thể trống rỗng. Mưu sự nhỏ thì thành, sự lớn khó được thực chất." },
            "Sơn Địa Bác": { stt: "23.", hanh: "Thổ", tuong: "Bác lạc ngõa giải chi quái, hao mòn rụng rơi chi tượng.", luan: "Bác giả lạc dã. Âm thịnh dương suy, tà khí ép chính khí. Mọi vật tiêu điều, tiêu tán, bóc lột. Lúc này chỉ nên giữ gìn cơ nghiệp cũ, tuyệt đối không nên tiến hành việc mới." },
            "Địa Lôi Phục": { stt: "24.", hanh: "Thổ", tuong: "Thiên hành hoàn bộ chi quái, dương khí quy lai chi tượng.", luan: "Phục giả phản dã. Sấm nổ dưới đất, dương khí đã trở lại. Bắt đầu sự hồi sinh, phục hồi sau thất bại. Mọi sự có dấu hiệu tốt lên, dần dần sẽ đắc chí." },
            "Thiên Lôi Vô Vọng": { stt: "25.", hanh: "Kim", tuong: "Điểu bị lũng lao chi quái, chính trực vô tâm chi tượng.", luan: "Vô Vọng giả thiên dã. Trời động nổi sấm, vạn vật thuận tự nhiên. Làm việc ngay thẳng, không mưu lợi tư kỷ thì hung hóa cát. Kẻ nuôi mộng tà dâm, gian trá ắt rước họa." },
            "Sơn Thiên Đại Súc": { stt: "26.", hanh: "Thổ", tuong: "Trận vân lôi giáng chi quái, tích lũy hùng hậu chi tượng.", luan: "Đại Súc giả tụ dã. Chứa đựng lớn lao, tài học phong phú. Núi cao kìm hãm bầu trời, phải biết tích trữ sức mạnh chờ ngày tỏa sáng. Vận thế đang độ vun đắp mạnh mẽ." },
            "Sơn Lôi Di": { stt: "27.", hanh: "Thổ", tuong: "Vị tủy tri túc chi quái, hàm dưỡng tu tâm chi tượng.", luan: "Di giả dưỡng dã. Miệng nhai thức ăn, nuôi dưỡng cơ thể. Phải chú ý ngôn từ và ăn uống. Họa từ miệng mà ra, bệnh từ miệng mà vào. Tu tâm dưỡng tính là gốc." },
            "Trạch Phong Đại Quá": { stt: "28.", hanh: "Kim", tuong: "Lâm mộc đống tồi chi quái, dương cương thái quá chi tượng.", luan: "Đại Quá giả điên dã. Cột nhà oằn cong, gánh nặng quá sức. Sự việc đi quá đà, cương quá tất gãy. Cần tìm cách giảm bớt áp lực, nếu không sẽ dẫn đến sụp đổ." },
            "Khảm Vi Thủy": { stt: "29.", hanh: "Thủy", tuong: "Hải để lao nguyệt chi quái, trọng hiểm trùng trùng chi tượng.", luan: "Khảm giả hãm dã. Nước chảy chỗ trũng, hiểm nguy chồng chất. Làm việc gì cũng gian nan vất vả, dễ bị vướng mắc, tiểu nhân hãm hại. Phải dùng sự chân thành và kiên nhẫn để vượt qua." },
            "Ly Vi Hỏa": { stt: "30.", hanh: "Hỏa", tuong: "Nhật lệ trung thiên chi quái, quang minh phụ dã chi tượng.", luan: "Ly giả lệ dã. Lửa bám vào vật mới cháy sáng. Trí tuệ sáng suốt, danh tiếng vang xa nhưng dễ bốc đồng, hư ảo. Tính tình nóng nảy, cẩn thận kiện tụng tranh chấp, mau tan." },
            "Trạch Sơn Hàm": { stt: "31.", hanh: "Kim", tuong: "Cảm ứng giao tế chi quái, nam nữ hữu tình chi tượng.", luan: "Hàm giả cảm dã. Thiếu nam nhường thiếu nữ, âm dương hòa hợp. Cảm ứng từ tâm, vô tâm mà thành sự. Rất tốt cho tình duyên, giao tiếp, hợp tác, đôi bên cùng vui vẻ." },
            "Lôi Phong Hằng": { stt: "32.", hanh: "Mộc", tuong: "Nhật nguyệt trường minh chi quái, cửu viễn thường đạo chi tượng.", luan: "Hằng giả cửu dã. Sấm gió nương nhau, đạo vợ chồng lâu bền. Làm việc gì cũng cần sự bền bỉ, kiên trì, không nên đứng núi này trông núi nọ. Có chí thì nên." },
            "Thiên Sơn Độn": { stt: "33.", hanh: "Kim", tuong: "Mật vân tế vũ chi quái, thoái nhượng ẩn cư chi tượng.", luan: "Độn giả thoái dã. Âm khí đang lên, dương đạo dần suy. Người quân tử nên biết rút lui, tránh mũi nhọn. Chớ tham danh lợi kẻo rước họa vào thân. Ẩn dật là kế sách hay." },
            "Lôi Thiên Đại Tráng": { stt: "34.", hanh: "Mộc", tuong: "Lôi chấn bách lý chi quái, dương khí thịnh cường chi tượng.", luan: "Đại Tráng giả chí dã. Sấm động trên trời, thanh thế lẫy lừng. Dương khí hưng thịnh, sức mạnh áp đảo. Tuy nhiên, nếu cậy sức mà làm liều sẽ mang vạ, cần phải biết chừng mực." },
            "Hỏa Địa Tấn": { stt: "35.", hanh: "Hỏa", tuong: "Minh nhật xuất thổ chi quái, thăng tiến vinh hiển chi tượng.", luan: "Tấn giả tiến dã. Mặt trời mọc lên khỏi mặt đất, ánh sáng rực rỡ chiếu rọi. Sự nghiệp thăng tiến, vinh hoa phú quý tới nơi. Phải giữ gìn đức hạnh rạng ngời mới bền vững." },
            "Địa Hỏa Minh Di": { stt: "36.", hanh: "Thổ", tuong: "Hạc linh thương tiễn chi quái, hắc ám tổn thương chi tượng.", luan: "Minh Di giả thương dã. Mặt trời lặn xuống đất, quang minh bị vùi lấp. Gặp thời tăm tối, dễ bị vu oan giá họa, tổn thương. Cần phải biết nhẫn nhục che giấu tài năng để tự bảo vệ." },
            "Phong Hỏa Gia Nhân": { stt: "37.", hanh: "Mộc", tuong: "Nhập hải cầu châu chi quái, tề gia trị quốc chi tượng.", luan: "Gia Nhân giả tề dã. Đạo vợ chồng, phép nhà nghiêm minh. Đàn bà giữ việc trong cửa, nội bộ êm ấm thì bên ngoài mới hưng thịnh. Rất tốt cho việc gia đạo, xây dựng tình cảm." },
            "Hỏa Trạch Khuê": { stt: "38.", hanh: "Hỏa", tuong: "Hổ lạc hãm tịnh chi quái, quải ngai trái ngược chi tượng.", luan: "Khuê giả bội dã. Lửa bốc lên, nước chảy xuống, hai bên không hợp nhau. Ý kiến trái chiều, nghi kị, chia lìa, mâu thuẫn nội bộ. Khó làm chung việc lớn, dễ dẫn đến cãi vã." },
            "Thủy Sơn Kiển": { stt: "39.", hanh: "Thủy", tuong: "Kiến hiểm nhi chỉ chi quái, gian nan trắc trở chi tượng.", luan: "Kiển giả nạn dã. Đường đi hiểm trở, nước đọng sườn núi, tiến bước gian nan. Thấy khó thì dừng lại là khôn ngoan. Tìm hướng khác hoặc tìm bậc đại nhân giúp đỡ mới xong." },
            "Lôi Thủy Giải": { stt: "40.", hanh: "Mộc", tuong: "Xuân lôi vạn đình chi quái, băng tiêu ngõa giải chi tượng.", luan: "Giải giả tán dã. Sấm nổ mưa rơi, khí xuân ấm áp làm tan băng tuyết. Tai nạn đã qua, nút thắt được tháo gỡ. Phải bao dung tha thứ, nhanh chóng hành động sửa chữa sai lầm." },
            "Sơn Trạch Tổn": { stt: "41.", hanh: "Thổ", tuong: "Lão thủ chi hành chi quái, tổn kỷ lợi nhân chi tượng.", luan: "Tổn giả thất dã. Lấy bớt phần dưới đắp cho phần trên. Thiệt mình ích người. Ban đầu có sự hao tốn tài sản, sức lực nhưng về sau sẽ có lợi ích lớn lao, tích đức thì hưởng lộc." },
            "Phong Lôi Ích": { stt: "42.", hanh: "Mộc", tuong: "Khô mộc phùng xuân chi quái, tăng trưởng lợi ích chi tượng.", luan: "Ích giả thịnh dã. Gió sấm kích động lẫn nhau, thêm phần cường thịnh. Trên giảm bớt để làm lợi cho dưới, được lòng dân. Mưu sự có lợi ích lớn, cây khô gặp mùa xuân đâm chồi nảy lộc." },
            "Trạch Thiên Quải": { stt: "43.", hanh: "Kim", tuong: "Thần kiến trảm giao chi quái, tiên tổn hậu ích chi tượng.", luan: "Quải giả quyết dã. Càn Đoài tương hình, ta hỏi âm gì. Văn tự khế ước, việc không dễ thành, tất phải quyết đoán, bắt đầu cát hanh." },
            "Thiên Phong Cấu": { stt: "44.", hanh: "Kim", tuong: "Phong vân tế hội chi quái, ngẫu nhiên tương ngộ chi tượng.", luan: "Cấu giả ngộ dã. Gió thổi dưới gầm trời, vật gì cũng chạm tới. Cuộc hội ngộ bất ngờ, âm xông lên lấn dương. Dễ gặp điềm tà khuất, nữ nhi mạnh mẽ lấn át nam giới, cần cảnh giác." },
            "Trạch Địa Tụy": { stt: "45.", hanh: "Kim", tuong: "Ngư thủy tương giao chi quái, quần anh tụ hội chi tượng.", luan: "Tụy giả tụ dã. Nước đọng trên mặt đất, tụ họp thành ao hồ. Người tài tìm đến nhau, của cải dồi dào tụ tập. Rất tốt cho việc hợp tác, lễ hội, kinh doanh buôn bán thu lợi nhuận." },
            "Địa Phong Thăng": { stt: "46.", hanh: "Thổ", tuong: "Tường vân tế nguyệt chi quái, thăng tiến thuận lợi chi tượng.", luan: "Thăng giả tiến dã. Cây non mọc dưới đất vươn lên đón ánh dương. Đi lên một cách từ từ, vững chắc và thuận lợi. Rất tốt cho thi cử, xin việc, thăng chức hoặc cầu tài." },
            "Trạch Thủy Khốn": { stt: "47.", hanh: "Kim", tuong: "Mộc khô thủy tận chi quái, nguy bách bế tắc chi tượng.", luan: "Khốn giả nguy dã. Cây nằm dưới hồ, nước rút cạn kiệt. Cảnh ngộ khó khăn, lực bất tòng tâm. Dù có tài năng cũng không có đất dụng võ. Nên giữ vững chí khí, chờ đợi thời cơ." },

            "Chấn Vi Lôi": { stt: "51.", hanh: "Mộc", tuong: "Bát vạn oai phong chi quái, sợ hãi kinh tâm chi tượng.", luan: "Chấn giả động dã. Sấm sét đùng đùng, vang dội trăm dặm. Mọi người kinh hãi, nhưng người quân tử lấy đó để tu sửa mình. Mọi việc đều biến động lớn, trước sợ hãi sau mới yên ổn." },
            "Cấn Vi Sơn": { stt: "52.", hanh: "Thổ", tuong: "Cẩu cắn cừu tử chi quái, tĩnh chỉ đình đốn chi tượng.", luan: "Cấn giả chỉ dã. Hai ngọn núi chắn ngang, cản trở bước tiến. Vạn vật ngưng trệ, đứng yên một chỗ. Thời điểm này không nên vội vã, cần biết điểm dừng, bình tâm suy xét." },
            "Phong Sơn Tiệm": { stt: "53.", hanh: "Mộc", tuong: "Cao sơn đại mộc chi quái, tuần tự tiệm tiến chi tượng.", luan: "Tiệm giả tiến dã. Cây mọc trên núi, lớn dần từng ngày. Chuyện tình duyên như chim hồng nhạn bay tìm bến đỗ, không thể vội vàng. Làm việc gì cũng phải từ từ, theo đúng thứ tự." },
            "Trạch Lôi Quy Muội": { stt: "54.", hanh: "Kim", tuong: "Cuộc tình bất chính chi quái, tiến thoái lưỡng nan chi tượng.", luan: "Quy Muội giả muội dã. Gái về nhà chồng mà tâm trí rối bời, không danh chính ngôn thuận. Làm việc mù quáng, trái với luân thường đạo lý. Cần hết sức thận trọng kẻo chuốc lấy thất bại." },
            "Thủy Thiên Nhu": { stt: "55.", hanh: "Thủy", tuong: "Vân ai trung thiên chi quái, mật vân bất vũ chi tượng.", luan: "Nhu giả tu dã. Mây mù đầy trời, gặp nguy hiểm không biết, thân sẽ ở nơi tai ách, e là bị liên lụy. Đại sự mong tới cùng, âu lo triền miên." },
            "Thủy Địa Tỷ": { stt: "56.", hanh: "Thủy", tuong: "Địa thủy giao ban chi quái, thân mật hòa hợp chi tượng.", luan: "Tỷ giả phụ dã. Nước trên đất, nương tựa lẫn nhau. Người trên thân cận kẻ dưới, được lòng người. Mưu sự hanh thông, kết giao tốt đẹp." },

            "Hỏa Thủy Vị Tế": { stt: "64.", hanh: "Hỏa", tuong: "Tiểu nhân hãm hại chi quái, chưa hoàn thành chi tượng.", luan: "Vị Tế giả bất thành dã. Lửa trên nước dưới, việc chưa xong. Cần tiếp tục kiên nhẫn phấn đấu." }
        };

        const CUNG_ELEMENTS = { "Càn": "Kim", "Đoài": "Kim", "Ly": "Hỏa", "Chấn": "Mộc", "Tốn": "Mộc", "Khảm": "Thủy", "Cấn": "Thổ", "Khôn": "Thổ" };

        // === HÀM HỖ TRỢ TÍNH TOÁN ===
        const layThandSatTKhong = (dayCan, dayChi, chiName) => {
            let tkList = []; 
            const dayCanChi = dayCan + " " + dayChi;
            if (["Giáp Tý", "Ất Sửu", "Bính Dần", "Đinh Mão", "Mậu Thìn", "Kỷ Tỵ", "Canh Ngọ", "Tân Mùi", "Nhâm Thân", "Quý Dậu"].includes(dayCanChi)) tkList = ["Tuất", "Hợi"];
            else if (["Giáp Tuất", "Ất Hợi", "Bính Tý", "Đinh Sửu", "Mậu Dần", "Kỷ Mão", "Canh Thìn", "Tân Tỵ", "Nhâm Ngọ", "Quý Mùi"].includes(dayCanChi)) tkList = ["Thân", "Dậu"];
            else if (["Giáp Thân", "Ất Dậu", "Bính Tuất", "Đinh Hợi", "Mậu Tý", "Kỷ Sửu", "Canh Dần", "Tân Mão", "Nhâm Thìn", "Quý Tỵ"].includes(dayCanChi)) tkList = ["Ngọ", "Mùi"];
            else if (["Giáp Ngọ", "Ất Mùi", "Bính Thân", "Đinh Dậu", "Mậu Tuất", "Kỷ Hợi", "Canh Tý", "Tân Sửu", "Nhâm Dần", "Quý Mão"].includes(dayCanChi)) tkList = ["Thìn", "Tỵ"];
            else if (["Giáp Thìn", "Ất Tỵ", "Bính Ngọ", "Đinh Mùi", "Mậu Thân", "Kỷ Dậu", "Canh Tuất", "Tân Hợi", "Nhâm Tý", "Quý Sửu"].includes(dayCanChi)) tkList = ["Dần", "Mão"];
            else tkList = ["Tý", "Sửu"]; 
            return tkList.includes(chiName) ? "K.Vong" : "-";
        };

        const tinhPhanNgamPhucNgam = (chuLines, bienLines, finalMoving) => {
            let props = []; let hasPhanNgam = false; let hasPhucNgam = false;
            for(let i=0; i<6; i++) {
                if(finalMoving[i]) {
                    if (chuLines[i].chi === bienLines[i].chi) hasPhucNgam = true;
                    if (DIA_CHI_XUNG[chuLines[i].chi] === bienLines[i].chi) hasPhanNgam = true;
                }
            }
            if (hasPhanNgam) props.push("Phản Ngâm"); if (hasPhucNgam) props.push("Phục Ngâm");
            return props;
        };

        // UI Helpers
        const getElementColor = (element) => {
            switch(element) {
                case 'Kim': return 'text-[#b8860b]'; 
                case 'Mộc': return 'text-[#15803d]'; 
                case 'Thủy': return 'text-[#1d4ed8]'; 
                case 'Hỏa': return 'text-[#dc2626]'; 
                case 'Thổ': return 'text-[#8b4513]'; 
                default: return 'text-gray-800';
            }
        };

        const getRoleColor = (role) => {
            if (role.includes('THỂ')) return 'text-gray-800';
            if (role.includes('DỤNG')) return 'text-[#dc2626]';
            if (role.includes('BIẾN')) return 'text-[#0284c7]';
            return 'text-gray-600';
        };

        const getLucThuColor = (lucThu) => {
            switch(lucThu) {
                case 'Thanh Long': return 'text-[#15803d]'; 
                case 'Chu Tước': return 'text-[#dc2626]'; 
                case 'Câu Trần': return 'text-[#8b4513]'; 
                case 'Đằng Xà': return 'text-[#7e22ce]'; 
                case 'Bạch Hổ': return 'text-[#4b5563]'; 
                case 'Huyền Vũ': return 'text-[#1d4ed8]'; 
                default: return 'text-gray-800';
            }
        };

        const getVuongSuyColor = (vs) => {
            if (["Vượng", "Tướng", "Q.Đới", "L.Quan", "Đ.Vượng"].includes(vs)) return "text-[#dc2626] font-bold";
            if (["Hưu", "Tù", "Tử", "Tuyệt", "Mộ"].includes(vs)) return "text-gray-500 font-medium";
            return "text-[#8b4513] font-bold";
        };

        const getTruongSinhColor = (ts) => {
            if (["T.Sinh", "Q.Đới", "L.Quan", "Đ.Vượng"].includes(ts)) return "text-[#dc2626] font-bold"; 
            if (["M.Dục", "Suy", "Thai", "Dưỡng"].includes(ts)) return "text-[#ca8a04] font-semibold"; 
            if (["Bệnh", "Tử", "Mộ", "Tuyệt"].includes(ts)) return "text-gray-500 font-medium"; 
            return "text-gray-800";
        };

        function getLucThan(cungNguHanH, haoNguHanh) {
            if (cungNguHanH === haoNguHanh) return 'Huynh Đệ';
            if (ELEMENTS_RELATION[cungNguHanH].sinh === haoNguHanh) return 'Tử Tôn';
            if (ELEMENTS_RELATION[cungNguHanH].khac === haoNguHanh) return 'Thê Tài';
            if (ELEMENTS_RELATION[haoNguHanh].sinh === cungNguHanH) return 'Phụ Mẫu';
            if (ELEMENTS_RELATION[haoNguHanh].khac === cungNguHanH) return 'Quan Quỷ';
            return '';
        }

        function anLinhHao(trigramId, stepIdx) {
            const isUpper = stepIdx >= 3;
            const subIdx = stepIdx % 3;
            const napArray = isUpper ? NAP_GIAP[trigramId].ngoai : NAP_GIAP[trigramId].noi;
            const parts = napArray[subIdx].split(' ');
            return { can: parts[0], chi: parts[1], element: CHI_NGU_HANH[parts[1]] || "Kim" };
        }

        function timPhucThan(cungName, chuLines) {
            const cungElement = CUNG_ELEMENTS[cungName];
            const neededLucThan = ["Huynh Đệ", "Tử Tôn", "Thê Tài", "Quan Quỷ", "Phụ Mẫu"];
            const ownedLucThan = chuLines.map(l => l.lucThan);
            const missing = neededLucThan.filter(t => !ownedLucThan.includes(t));
            if (missing.length === 0) return {};
            const masterTrigram = BAT_QUAI.find(b => b.name === cungName);
            if (!masterTrigram) return {};
            const mapPhuc = {};
            for (let idx = 0; idx < 6; idx++) {
                const isUpper = idx >= 3;
                const napArray = isUpper ? NAP_GIAP[masterTrigram.id].ngoai : NAP_GIAP[masterTrigram.id].noi;
                const parts = napArray[idx % 3].split(' ');
                const element = CHI_NGU_HANH[parts[1]];
                const lucThan = getLucThan(cungElement, element);
                if (missing.includes(lucThan)) mapPhuc[idx] = { lucThan, can: parts[0], chi: parts[1], element };
            }
            return mapPhuc;
        }

        const checkVuongSuy = (haoElement, mChi) => {
            const monthEl = CHI_NGU_HANH[mChi];
            if (haoElement === monthEl) return "Vượng"; 
            if (ELEMENTS_RELATION[monthEl].sinh === haoElement) return "Tướng"; 
            if (ELEMENTS_RELATION[haoElement].sinh === monthEl) return "Hưu"; 
            if (ELEMENTS_RELATION[haoElement].khac === monthEl) return "Tù"; 
            if (ELEMENTS_RELATION[monthEl].khac === haoElement) return "Tử"; 
            return "Hưu";
        };

        const BlockHexagram = ({ lines, isMovingArray = [], className = "w-[38px] sm:w-[42px] space-y-[2.5px] my-1" }) => (
            <div className={className}>
                {lines.slice().reverse().map((bin, revIdx) => {
                    const idx = lines.length - 1 - revIdx;
                    const isMoving = isMovingArray[idx] || false;
                    const color = isMoving ? 'bg-[#ef4444]' : 'bg-[#000000]';
                    return (
                        <div key={idx} className={`h-[5px] flex flex-col justify-center`}>
                            {bin === 1 ? (
                                <div className={`w-full h-full ${color}`}></div>
                            ) : (
                                <div className="w-full h-full flex justify-between">
                                    <div className={`w-[42%] h-full ${color}`}></div>
                                    <div className={`w-[42%] h-full ${color}`}></div>
                                </div>
                            )}
                        </div>
                    );
                })}
            </div>
        );

        const TableLineSymbol = ({ binary, isMoving }) => {
            const color = isMoving ? 'bg-[#ef4444]' : 'bg-[#000000]';
            return (
                <div className="w-4 sm:w-5 h-[3px] mx-auto flex flex-col justify-center my-[1px]">
                    {binary === 1 ? (
                        <div className={`w-full h-full ${color}`}></div>
                    ) : (
                        <div className="w-full h-full flex justify-between">
                            <div className={`w-[40%] h-full ${color}`}></div>
                            <div className={`w-[40%] h-full ${color}`}></div>
                        </div>
                    )}
                </div>
            );
        };

        // === COMPONENT CHÍNH ===
        const MainApp = () => {
            const [view, setView] = React.useState('setup'); 
            const [systemType, setSystemType] = React.useState('luchao'); 
            
            const [upperId, setUpperId] = React.useState(7); 
            const [lowerId, setLowerId] = React.useState(0); 
            const [moving, setMoving] = React.useState([false, false, false, false, false, false]); 
            
            const [numUpper, setNumUpper] = React.useState('8');
            const [numLower, setNumLower] = React.useState('1');
            const [numMoving, setNumMoving] = React.useState('1');
            const [serialString, setSerialString] = React.useState(''); 
            
            const [vanSu, setVanSu] = React.useState('');

            const [solarDate, setSolarDate] = React.useState(''); 
            const [solarTime, setSolarTime] = React.useState(''); 
            
            const [lunarDay, setLunarDay] = React.useState('');
            const [lunarMonth, setLunarMonth] = React.useState('');
            const [lunarYear, setLunarYear] = React.useState('');
            
            const [tietKhi, setTietKhi] = React.useState('Chưa rõ/Không dùng');
            
            const [yearCan, setYearCan] = React.useState('Giáp'); const [yearChi, setYearChi] = React.useState('Thìn');
            const [monthCan, setMonthCan] = React.useState('Bính'); const [monthChi, setMonthChi] = React.useState('Dần');
            const [dayCan, setDayCan] = React.useState('Giáp'); const [dayChi, setDayChi] = React.useState('Tý');
            const [hourCan, setHourCan] = React.useState('Giáp'); const [hourChi, setHourChi] = React.useState('Tý');

            const [notification, setNotification] = React.useState('');

            const showNotification = (msg) => { setNotification(msg); setTimeout(() => setNotification(''), 3500); };

            const thietLapGioHienTai = () => {
                const current = new Date();
                setSolarDate(`${current.getFullYear()}-${String(current.getMonth() + 1).padStart(2, '0')}-${String(current.getDate()).padStart(2, '0')}`);
                setSolarTime(`${String(current.getHours()).padStart(2, '0')}:${String(current.getMinutes()).padStart(2, '0')}`);
            };

            React.useEffect(() => { thietLapGioHienTai(); }, []);

            React.useEffect(() => {
                if (!solarDate) return;
                try {
                    const [yyyy, mm, dd] = solarDate.split('-').map(Number);
                    let hh = 0, mins = 0; if (solarTime) { const parts = solarTime.split(':').map(Number); hh = parts[0]||0; mins = parts[1]||0; }
                    const current = new Date(yyyy, mm - 1, dd, hh, mins);
                    if (typeof Lunar !== 'undefined' && typeof Solar !== 'undefined') {
                        const lunar = Solar.fromDate(current).getLunar();
                        let lMonth = lunar.getMonth();
                        setLunarMonth(String(Math.abs(lMonth))); 
                        setLunarDay(String(lunar.getDay())); setLunarYear(String(lunar.getYear()));

                        const baZi = lunar.getEightChar();
                        const canMap = {'甲':0, '乙':1, '丙':2, '丁':3, '戊':4, '己':5, '庚':6, '辛':7, '壬':8, '癸':9};
                        const chiMap = {'子':0, '丑':1, '寅':2, '卯':3, '辰':4, '巳':5, '午':6, '未':7, '申':8, '酉':9, '戌':10, '亥':11};
                        if (baZi) {
                            if (canMap[baZi.getYearGan()] !== undefined) setYearCan(THIEN_CAN[canMap[baZi.getYearGan()]]);
                            if (chiMap[baZi.getYearZhi()] !== undefined) setYearChi(DIA_CHI[chiMap[baZi.getYearZhi()]]);
                            if (canMap[baZi.getMonthGan()] !== undefined) setMonthCan(THIEN_CAN[canMap[baZi.getMonthGan()]]);
                            if (chiMap[baZi.getMonthZhi()] !== undefined) setMonthChi(DIA_CHI[chiMap[baZi.getMonthZhi()]]);
                            if (canMap[baZi.getDayGan()] !== undefined) setDayCan(THIEN_CAN[canMap[baZi.getDayGan()]]);
                            if (chiMap[baZi.getDayZhi()] !== undefined) setDayChi(DIA_CHI[chiMap[baZi.getDayZhi()]]);
                            if (canMap[baZi.getTimeGan()] !== undefined) setHourCan(THIEN_CAN[canMap[baZi.getTimeGan()]]);
                            if (chiMap[baZi.getTimeZhi()] !== undefined) setHourChi(DIA_CHI[chiMap[baZi.getTimeZhi()]]);
                            
                            const yIndex = chiMap[baZi.getYearZhi()];
                            const hIndex = chiMap[baZi.getTimeZhi()];
                            
                            if(yIndex !== undefined && hIndex !== undefined) {
                                const yNum = yIndex + 1;
                                const mNum = Math.abs(lunar.getMonth());
                                const dNum = lunar.getDay();
                                const hNum = hIndex + 1;
                                
                                let upper = (yNum + mNum + dNum) % 8; if (upper === 0) upper = 8;
                                let lower = (yNum + mNum + dNum + hNum) % 8; if (lower === 0) lower = 8;
                                let dong = (yNum + mNum + dNum + hNum) % 6; if (dong === 0) dong = 6;
                                
                                setNumUpper(upper.toString());
                                setNumLower(lower.toString());
                                setNumMoving(dong.toString());
                                setSerialString('');
                            }

                            const jq = lunar.getPrevJieQi(true);
                            if(jq) {
                                const JQ_MAP = {"立春":"Lập Xuân","雨水":"Vũ Thủy","惊蛰":"Kinh Trập","春分":"Xuân Phân","清明":"Thanh Minh","谷雨":"Cốc Vũ","立夏":"Lập Hạ","小满":"Tiểu Mãn","芒种":"Mang Chủng","夏至":"Hạ Chí","小暑":"Tiểu Thử","大暑":"Đại Thử","立秋":"Lập Thu","处暑":"Xử Thử","白露":"Bạch Lộ","秋分":"Thu Phân","寒露":"Hàn Lộ","霜降":"Sương Giáng","立冬":"Lập Đông","小雪":"Tiểu Tuyết","大雪":"Đại Tuyết","冬至":"Dong Chí","小寒":"Tiểu Hàn","大寒":"Đại Hàn"};
                                if(JQ_MAP[jq.getName()]) setTietKhi(JQ_MAP[jq.getName()]);
                            }
                        }
                    }
                } catch(e) {
                    console.error("Lỗi parse ngày tháng Lunar:", e);
                }
            }, [solarDate, solarTime]); 

            const handleSerialChange = (val) => {
                setSerialString(val);
                const digits = val.replace(/\D/g, ''); 
                if (digits.length > 0) {
                    const mid = Math.floor(digits.length / 2);
                    const s1 = digits.slice(0, mid); const s2 = digits.slice(mid);
                    let sum1 = s1.split('').reduce((acc, curr) => acc + parseInt(curr), 0);
                    let sum2 = s2.split('').reduce((acc, curr) => acc + parseInt(curr), 0);
                    if (s1.length === 0) sum1 = sum2; 
                    if (sum1 === 0) sum1 = 8; if (sum2 === 0) sum2 = 8;
                    let upper = sum1 % 8; if (upper === 0) upper = 8;
                    let lower = sum2 % 8; if (lower === 0) lower = 8;
                    let movingLine = (sum1 + sum2) % 6; if (movingLine === 0) movingLine = 6;
                    setNumUpper(upper.toString()); setNumLower(lower.toString()); setNumMoving(movingLine.toString());
                }
            };

            const toggleHaoDong = (index) => { const nextMov = [...moving]; nextMov[index] = !nextMov[index]; setMoving(nextMov); };

            const handleGieoQueTuDong = () => {
                let linesBinary = []; let newMoving = [false, false, false, false, false, false];
                for(let i = 0; i < 6; i++) {
                    let sum = (Math.random() > 0.5 ? 3 : 2) + (Math.random() > 0.5 ? 3 : 2) + (Math.random() > 0.5 ? 3 : 2);
                    if (sum === 9) { linesBinary.push(1); newMoving[i] = true; } 
                    else if (sum === 8) { linesBinary.push(0); newMoving[i] = false; } 
                    else if (sum === 7) { linesBinary.push(1); newMoving[i] = false; } 
                    else if (sum === 6) { linesBinary.push(0); newMoving[i] = true; } 
                }
                setLowerId(findTrigramFromBinary(linesBinary.slice(0, 3))); setUpperId(findTrigramFromBinary(linesBinary.slice(3, 6))); setMoving(newMoving);
                showNotification("Gieo 6 lần đồng xu hoàn tất! Đã lập quẻ mới.");
            };

            const handleGieoMaiHoaTuDong = () => {
                let upper = Math.floor(Math.random() * 8) + 1;
                let lower = Math.floor(Math.random() * 8) + 1;
                let dong = Math.floor(Math.random() * 6) + 1;
                setNumUpper(upper.toString());
                setNumLower(lower.toString());
                setNumMoving(dong.toString());
                setSerialString(''); 
                showNotification("Lấy số ngẫu nhiên Mai Hoa hoàn tất!");
            };

            const handleLapMaiHoaTheoGio = () => {
                const chiToNum = { 'Tý': 1, 'Sửu': 2, 'Dần': 3, 'Mão': 4, 'Thìn': 5, 'Tỵ': 6, 'Ngọ': 7, 'Mùi': 8, 'Thân': 9, 'Dậu': 10, 'Tuất': 11, 'Hợi': 12 };
                const yNum = chiToNum[yearChi];
                const mNum = parseInt(lunarMonth);
                const dNum = parseInt(lunarDay);
                const hNum = chiToNum[hourChi];
                
                if(!yNum || !mNum || !dNum || !hNum) {
                    showNotification("Thời gian chưa hợp lệ, vui lòng kiểm tra lại!");
                    return;
                }
                
                let upper = (yNum + mNum + dNum) % 8; if (upper === 0) upper = 8;
                let lower = (yNum + mNum + dNum + hNum) % 8; if (lower === 0) lower = 8;
                let dong = (yNum + mNum + dNum + hNum) % 6; if (dong === 0) dong = 6;
                
                setNumUpper(upper.toString());
                setNumLower(lower.toString());
                setNumMoving(dong.toString());
                setSerialString(''); 
                showNotification("Đã thiết lập Mai Hoa theo thời gian hiện tại!");
            };

            // QUÁ TRÌNH TÍNH TOÁN QUẺ KHI RENDER KẾT QUẢ
            const keyChu = `${upperId}_${lowerId}`;
            const [chuName, chuCungName, chuTheHao, chuThoan = "", chuProps = []] = HEXAGRAM_DATABASE[keyChu] || ["Quẻ Lạ", "Càn", 6, "HUNG CÁT KHÓ LƯỜNG", []];
            const chuCungElement = CUNG_ELEMENTS[chuCungName];
            const chuUngHao = (chuTheHao + 2) % 6 + 1;

            const chuLines = [];
            const upperBin = BAT_QUAI[upperId].binary; const lowerBin = BAT_QUAI[lowerId].binary;
            const totalBinChu = [...lowerBin, ...upperBin]; 
            for (let idx = 0; idx < 6; idx++) {
                const info = anLinhHao(idx >= 3 ? upperId : lowerId, idx);
                chuLines.push({ index: idx, binary: totalBinChu[idx], can: info.can, chi: info.chi, element: info.element, lucThan: getLucThan(chuCungElement, info.element), isDong: moving[idx] });
            }

            const mapPhuc = timPhucThan(chuCungName, chuLines);
            
            const totalBinBien = totalBinChu.map((val, idx) => moving[idx] ? (val === 1 ? 0 : 1) : val);
            const bienLowerId = findTrigramFromBinary(totalBinBien.slice(0, 3)); const bienUpperId = findTrigramFromBinary(totalBinBien.slice(3, 6));
            const [bienName, bienCungName, , bienThoan = "", bienProps = []] = HEXAGRAM_DATABASE[`${bienUpperId}_${bienLowerId}`] || ["Biến Quẻ", "Khôn", 6, "", []];
            const bienLines = [];
            for (let idx = 0; idx < 6; idx++) {
                const info = anLinhHao(idx >= 3 ? bienUpperId : bienLowerId, idx);
                bienLines.push({ index: idx, binary: totalBinBien[idx], can: info.can, chi: info.chi, element: info.element, lucThan: getLucThan(chuCungElement, info.element) });
            }

            const hoLowerId_LH = findTrigramFromBinary([totalBinChu[1], totalBinChu[2], totalBinChu[3]]);
            const hoUpperId_LH = findTrigramFromBinary([totalBinChu[2], totalBinChu[3], totalBinChu[4]]);
            const [lhHoName, lhHoCungName = "", , lhHoThoan = "", hoProps = []] = HEXAGRAM_DATABASE[`${hoUpperId_LH}_${hoLowerId_LH}`] || ["Quẻ Hỗ", "", 0, "", []];
            const lhHoBin = [...BAT_QUAI[hoLowerId_LH].binary, ...BAT_QUAI[hoUpperId_LH].binary];

            const startLucThuIdx = LUC_THU_KHOI[dayCan] || 0; const lucThuLineList = [];
            for (let i = 0; i < 6; i++) lucThuLineList.push(LUC_THU_LIST[(startLucThuIdx + i) % 6]);

            const layQuaiMaiHoa = (num) => BAT_QUAI.find(q => q.number === (parseInt(num)%8||8)) || BAT_QUAI[0];
            const mhUpperQuai = layQuaiMaiHoa(numUpper); const mhLowerQuai = layQuaiMaiHoa(numLower); const mhHaoDong = (parseInt(numMoving)%6||6); 
            const totalMhBinChu = [...mhLowerQuai.binary, ...mhUpperQuai.binary];
            const totalMhBinBien = totalMhBinChu.map((v, i) => (i === (mhHaoDong - 1)) ? (v === 1 ? 0 : 1) : v);

            const mhLowerBienId = findTrigramFromBinary(totalMhBinBien.slice(0, 3)); const mhUpperBienId = findTrigramFromBinary(totalMhBinBien.slice(3, 6));

            const [mhChuNameFull, , , mhChuThoan = "", mhChuProps = []] = HEXAGRAM_DATABASE[`${mhUpperQuai.id}_${mhLowerQuai.id}`] || ["", "", 0, "", []];
            const [mhBienNameFull, mhBienCungName = "", , mhBienThoan = "", mhBienProps = []] = HEXAGRAM_DATABASE[`${mhUpperBienId}_${mhLowerBienId}`] || ["", "", 0, "", []];

            const hoUpperQuai = BAT_QUAI[findTrigramFromBinary([totalMhBinChu[2], totalMhBinChu[3], totalMhBinChu[4]])]; 
            const hoLowerQuai = BAT_QUAI[findTrigramFromBinary([totalMhBinChu[1], totalMhBinChu[2], totalMhBinChu[3]])];
            const [mhHoNameFull, mhHoCungName = "", , mhHoThoan = "", mhHoProps = []] = HEXAGRAM_DATABASE[`${hoUpperQuai.id}_${hoLowerQuai.id}`] || ["", "", 0, "", []];

            const finalChuName = systemType === 'luchao' ? chuName : mhChuNameFull;

            const finalBienName = systemType === 'luchao' ? bienName : mhBienNameFull;
            
            const finalChuProps = systemType === 'luchao' ? chuProps : mhChuProps;
            const finalHoProps = systemType === 'luchao' ? hoProps : mhHoProps;
            
            const finalChuBin = systemType === 'luchao' ? totalBinChu : totalMhBinChu;
            const finalHoBin = systemType === 'luchao' ? lhHoBin : [...hoLowerQuai.binary, ...hoUpperQuai.binary];
            const finalBienBin = systemType === 'luchao' ? totalBinBien : totalMhBinBien;
            const finalMoving = systemType === 'luchao' ? moving : [false,false,false,false,false,false].map((v,i) => i === mhHaoDong - 1);

            const pnPnProps = tinhPhanNgamPhucNgam(chuLines, bienLines, finalMoving);
            let finalBienProps = systemType === 'luchao' ? bienProps : mhBienProps;
            if (pnPnProps.length > 0) finalBienProps = [...finalBienProps, ...pnPnProps];

            const finalChuCung = systemType === 'luchao' ? chuCungName : BAT_QUAI[findTrigramFromBinary(finalChuBin.slice(3,6))].name;
            const finalHoCung = systemType === 'luchao' ? lhHoCungName : mhHoCungName;
            const finalBienCung = systemType === 'luchao' ? bienCungName : mhBienCungName;

            const finalChuThoan = systemType === 'luchao' ? chuThoan : mhChuThoan;
            const finalHoThoan = systemType === 'luchao' ? lhHoThoan : mhHoThoan;
            const finalBienThoan = systemType === 'luchao' ? bienThoan : mhBienThoan;

            const formatTextProps = (propsArr) => { if (!propsArr || propsArr.length === 0) return ''; return propsArr.join(' - '); };

            const chuPropText = formatTextProps(finalChuProps);
            const hoPropText = formatTextProps(finalHoProps);
            const bienPropText = formatTextProps(finalBienProps);

            // LOGIC MAI HOA THỂ DỤNG VÀ NGŨ HÀNH
            let mhUpperRole, mhLowerRole, hoUpperRole, hoLowerRole, bienUpperRole, bienLowerRole;
            let hoUpperInfo, hoLowerInfo, bienUpperInfo, bienLowerInfo;
            if (systemType === 'maihoa') {
                const isUpperDong = mhHaoDong > 3;
                mhUpperRole = isUpperDong ? 'DỤNG' : 'THỂ';
                mhLowerRole = isUpperDong ? 'THỂ' : 'DỤNG';
                hoUpperRole = isUpperDong ? 'H.DỤNG' : 'H.THỂ';
                hoLowerRole = isUpperDong ? 'H.THỂ' : 'H.DỤNG';
                bienUpperRole = isUpperDong ? 'BIẾN' : 'THỂ';
                bienLowerRole = isUpperDong ? 'THỂ' : 'BIẾN';

                hoUpperInfo = hoUpperQuai;
                hoLowerInfo = hoLowerQuai;
                bienUpperInfo = BAT_QUAI[mhUpperBienId];
                bienLowerInfo = BAT_QUAI[mhLowerBienId];
            }

            const handleSetupSubmit = () => { 
                setView('result'); 
            };

            const handleExportImage = () => {
                const captureArea = document.getElementById('pdf-render-zone'); 
                if (!captureArea) return;
                showNotification("Đang xuất ảnh lá quẻ. Vui lòng chờ giây lát...");
                captureArea.classList.add('export-mode');
                html2canvas(captureArea, { scale: 3, useCORS: true, backgroundColor: '#fdfaf2' }).then(canvas => { 
                    captureArea.classList.remove('export-mode'); 
                    const link = document.createElement('a');
                    link.download = `La-Que-ThienCo-${systemType}.png`; 
                    link.href = canvas.toDataURL('image/png', 1.0); 
                    link.click();
                    showNotification("Tải ảnh thành công!"); 
                }).catch(err => { 
                    captureArea.classList.remove('export-mode'); 
                    showNotification("Lỗi xuất ảnh! Hãy thử lại."); 
                    console.error(err);
                });
            };

            const luanData = QUE_LUAN_CHI_TIET[finalChuName] || {
                stt: "",
                hanh: chuCungElement,
                tuong: `Tượng quẻ: ${finalChuThoan}`,
                luan: `Quẻ ${finalChuName} thuộc cung ${finalChuCung} (hành ${chuCungElement}). Đặc tính quẻ: ${chuPropText || 'Bình hòa'}. Người xem cần chú ý kỹ Dụng thần và nguyên lý sinh khắc giữa các hào để định cát hung chi tiết.`
            };

            return (

                    {notification && (
                        <div className="fixed top-8 left-1/2 transform -translate-x-1/2 bg-gray-900/95 text-white px-5 py-3 rounded-xl shadow-2xl z-50 text-sm font-bold transition-all duration-300 flex items-center gap-2 border border-gray-700 backdrop-blur-sm">
                            <i className="fa-solid fa-circle-check text-green-400 text-lg"></i>
                            {notification}
                        </div>
                    )}

                    {view === 'setup' && (
                        <div className="w-full max-w-[900px] grid grid-cols-1 lg:grid-cols-12 gap-6 mt-4">
                            {/* FORM THIẾT LẬP */}
                            <div className="lg:col-span-5 bg-white p-5 rounded-2xl shadow-xl border border-amber-200 flex flex-col gap-4">
                                
                                <div className="text-center">
                                    <h1 className="text-xl font-bold uppercase serif-title tracking-wider rainbow-text">THIÊN CƠ TỬU KHÁCH</h1>
                                    <p className="text-xs text-gray-500">Chuyên sâu Cầu Tài - Tình Duyên - Phong Thủy</p>
                                </div>

                                <div className="flex bg-amber-100 p-1 rounded-lg w-full">
                                    <button onClick={() => setSystemType('luchao')} className={`flex-1 py-2 text-sm font-bold rounded-md transition-all ${systemType === 'luchao' ? 'bg-white text-[#dc2626] shadow' : 'text-amber-800'}`}>LỤC HÀO</button>
                                    <button onClick={() => setSystemType('maihoa')} className={`flex-1 py-2 text-sm font-bold rounded-md transition-all ${systemType === 'maihoa' ? 'bg-white text-[#dc2626] shadow' : 'text-amber-800'}`}>MAI HOA</button>
                                </div>

                                {/* CHỦ ĐỀ VẤN SỰ */}
                                <div className="bg-white border border-amber-200 p-4 rounded-xl shadow-sm">
                                    <label className="text-sm font-bold text-amber-900 uppercase flex items-center gap-2 mb-2">
                                        <i className="fa-solid fa-pen-nib text-amber-600"></i> Nội dung Vấn sự
                                    </label>
                                    <input 
                                        type="text" 
                                        value={vanSu} 
                                        onChange={e => setVanSu(e.target.value)} 
                                        placeholder="Nhập việc cần hỏi (không bắt buộc)..." 
                                        className="w-full border border-gray-300 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all bg-gray-50"

                                            <input type="number" value={lunarMonth} readOnly className="w-1/3 border rounded p-1.5 text-sm bg-gray-50 text-center text-gray-500 font-medium" title="Tháng Âm lịch" />
                                            <input type="number" value={lunarYear} readOnly className="w-1/3 border rounded p-1.5 text-sm bg-gray-50 text-center text-gray-500 font-medium" title="Năm Âm lịch" />

                                            <div className="flex gap-1"><select value={monthCan} onChange={e => setMonthCan(e.target.value)} className="w-1/2 border rounded p-1 text-xs outline-none">{THIEN_CAN.map(c => <option key={c} value={c}>{c}</option>)}</select><select value={monthChi} onChange={e => setMonthChi(e.target.value)} className="w-1/2 border rounded p-1 text-xs outline-none">{DIA_CHI.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                                            <div className="flex gap-1"><select value={dayCan} onChange={e => setDayCan(e.target.value)} className="w-1/2 border rounded p-1 text-xs outline-none">{THIEN_CAN.map(c => <option key={c} value={c}>{c}</option>)}</select><select value={dayChi} onChange={e => setDayChi(e.target.value)} className="w-1/2 border rounded p-1 text-xs outline-none">{DIA_CHI.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                                            <div className="flex gap-1"><select value={hourCan} onChange={e => setHourCan(e.target.value)} className="w-1/2 border rounded p-1 text-xs outline-none">{THIEN_CAN.map(c => <option key={c} value={c}>{c}</option>)}</select><select value={hourChi} onChange={e => setHourChi(e.target.value)} className="w-1/2 border rounded p-1 text-xs outline-none">{DIA_CHI.map(c => <option key={c} value={c}>{c}</option>)}</select></div>
                                        </div>
                                    </div>
                                </div>

                                {/* CHẾ ĐỘ LỤC HÀO HAY MAI HOA */}
                                {systemType === 'luchao' && (
                                    <div className="border-t border-amber-100 pt-3 flex flex-col gap-3">
                                        <div className="flex justify-between items-center"><h3 className="text-sm font-bold text-amber-900 uppercase">Thiết lập Lục Hào</h3><button onClick={handleGieoQueTuDong} className="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded text-[11px] font-bold transition">Gieo Xu Ngẫu Nhiên</button></div>
                                        <div><label className="text-[11px] font-bold text-gray-600 block mb-1">Thượng Quái:</label><select value={upperId} onChange={e => setUpperId(parseInt(e.target.value))} className="w-full border rounded p-2 text-sm outline-none">{BAT_QUAI.map(q => <option key={q.id} value={q.id}>{q.name}</option>)}</select></div>
                                        <div><label className="text-[11px] font-bold text-gray-600 block mb-1">Hạ Quái:</label><select value={lowerId} onChange={e => setLowerId(parseInt(e.target.value))} className="w-full border rounded p-2 text-sm outline-none">{BAT_QUAI.map(q => <option key={q.id} value={q.id}>{q.name}</option>)}</select></div>
                                        <div className="grid grid-cols-6 gap-2">{[0, 1, 2, 3, 4, 5].map(idx => (<button key={idx} onClick={() => toggleHaoDong(idx)} className={`py-1.5 text-xs font-bold rounded border transition ${moving[idx] ? 'bg-red-600 border-red-700 text-white shadow' : 'bg-white text-gray-700 hover:bg-gray-50'}`}>Hào {idx + 1}</button>))}</div>
                                    </div>

                                {systemType === 'maihoa' && (

                                        <div className="grid grid-cols-3 gap-2 mt-1">

                                                        const tsMonth = TR_SINH_MAP[line.element][monthChi];
                                                        
                                                        const vsMonthB = isMoving ? checkVuongSuy(bLine.element, monthChi) : "-";
                                                        const tsDayB = isMoving ? TR_SINH_MAP[bLine.element][dayChi] : "-";
                                                        const tsMonthB = isMoving ? TR_SINH_MAP[bLine.element][monthChi] : "-";

                                                        return (
                                                            <tr key={idx} className={isMoving ? "hao-dong-highlight bg-[#fff5f5]" : ""}>
                                                                <td className="font-bold whitespace-nowrap">
                                                                    <span className={getElementColor(CAN_NGU_HANH[line.can])}>{line.can}</span>{' '}
                                                                    <span className={getElementColor(line.element)}>{line.chi}</span>
                                                                </td>
                                                                <td className={getVuongSuyColor(vsMonth)}>{vsMonth}</td>
                                                                <td className="text-gray-400 font-medium">-</td>
                                                                <td className={getTruongSinhColor(tsDay)}>{tsDay}</td>
                                                                <td className={getTruongSinhColor(tsMonth)}>{tsMonth}</td>
                                                                
                                                                <td className={`font-bold whitespace-nowrap ${isMoving ? '' : 'text-gray-300'}`}>
                                                                    {isMoving ? (
                                                                        <>
                                                                            <span className={getElementColor(CAN_NGU_HANH[bLine.can])}>{bLine.can}</span>{' '}
                                                                            <span className={getElementColor(bLine.element)}>{bLine.chi}</span>
                                                                        </>
                                                                    ) : "-"}
                                                                </td>
                                                                <td className={isMoving ? getVuongSuyColor(vsMonthB) : 'text-gray-300'}>{isMoving ? vsMonthB : "-"}</td>
                                                                <td className={isMoving ? getTruongSinhColor(tsDayB) : 'text-gray-300'}>{isMoving ? tsDayB : "-"}</td>
                                                                <td className={isMoving ? getTruongSinhColor(tsMonthB) : 'text-gray-300'}>{isMoving ? tsMonthB : "-"}</td>
                                                            </tr>
                                                        );
                                                    })}
                                                </tbody>
                                            </table>
                                        </>
                                    )}

                                    {/* FOOTER */}
                                    <div className="mt-1.5 pt-1.5 border-t border-[#d4af37] flex flex-row justify-between items-end px-2 gap-2 pb-1">
                                        <div className="text-[8.5px] sm:text-[10px] font-medium space-y-1 document-text text-left">
                                            <p className="text-[#dc2626] font-bold mb-1.5 uppercase tracking-wide">Hệ thống an sao Dịch Lý</p>
                                            <p className="flex items-center gap-1.5 text-gray-800"><i className="fa-brands fa-facebook text-[#1877F2]"></i> <span>FB: Lê Hữu Hải</span></p>
                                            <p className="flex items-center gap-1.5 text-gray-800"><i className="fa-solid fa-square-phone text-[#25D366]"></i> <span>Zalo: 0982076615</span></p>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-[8.5px] sm:text-[10px] text-amber-900 mb-[-2px] font-bold uppercase tracking-widest document-text">Luận giải bởi</p>
                                            <h3 className="text-[18px] sm:text-[22px] text-[#b8860b] signature-font font-bold">Thiên Cơ Tửu Khách</h3>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
</body>
